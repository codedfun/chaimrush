<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chaim Rush</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chaim Rush">
<meta name="theme-color" content="#16133a">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* Layout: a game title screen: header, a blue board with discs dropping in, a big Start button, and a passcode sheet. */
:root{
  color-scheme:dark;
  --night:#16133a; --panel:#221d52; --panel2:#2d2768; --ink:#fff6ea; --muted:#b8b1e8;
  --coral:#ff6a55; --gold:#ffc93c; --teal:#2ec4b6; --board:#2f5fd8; --board2:#2449ad;
  --display:"Bungee",Impact,"Arial Black",sans-serif;
  --body:"Rubik",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--night)}
body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% 0%,#3b2a6e 0%,var(--night) 60%);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.back{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;text-decoration:none;color:inherit;background:var(--panel2);border-radius:999px;padding:8px 14px 8px 10px;font-weight:500;font-size:14px}
.back svg{width:18px;height:18px}
h1{font-family:var(--display);font-weight:400;font-size:42px;line-height:.95;margin:6px 0 0;text-align:center}
h1 span{color:var(--gold)}
.sub{margin:-6px 0 0;color:var(--muted);text-align:center;font-size:15px}
.board{width:100%;max-width:360px;aspect-ratio:7/6;background:linear-gradient(var(--board),var(--board2));border-radius:18px;padding:10px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;box-shadow:0 12px 0 #1a3480,0 20px 30px rgb(0 0 0/.35);overflow:hidden}
.cell{border-radius:50%;background:var(--night);box-shadow:inset 0 3px 6px rgb(0 0 0/.5);position:relative;overflow:hidden}
.disc{position:absolute;inset:8%;border-radius:50%;animation:drop .5s cubic-bezier(.4,0,.7,1.4) both}
.disc.r{background:radial-gradient(circle at 35% 30%,#ff9a85,var(--coral) 55%,#c84632)}
.disc.y{background:radial-gradient(circle at 35% 30%,#ffe28a,var(--gold) 55%,#c9921a)}
@keyframes drop{from{transform:translateY(-600%)}to{transform:none}}
.board.play{cursor:pointer}
.cell.win .disc{box-shadow:0 0 0 4px #fff,0 0 18px #fff}
.status{font-family:var(--display);font-size:20px;text-align:center;min-height:1.3em;margin:0}
.status .r{color:var(--coral)} .status .y{color:var(--gold)}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.controls button{border:0;border-radius:999px;background:var(--panel2);padding:10px 16px;font-weight:700;font-size:14px}
.controls button.on{background:var(--teal);color:#06231f}
.start{border:0;border-radius:18px;background:var(--coral);color:#1b0f0c;font-family:var(--display);font-size:26px;padding:15px 40px;box-shadow:0 6px 0 #b8402f}
.start:active{transform:translateY(3px);box-shadow:0 3px 0 #b8402f}
.how{color:var(--muted);font-size:13.5px;text-align:center;margin:0;max-width:340px;line-height:1.45}
.sheet{position:fixed;inset:0;background:rgb(14 11 38/.7);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);border-radius:22px;padding:22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;box-shadow:0 18px 40px rgb(0 0 0/.45)}
.card h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.card p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.45}
.code{font:inherit;font-family:var(--display);font-size:30px;letter-spacing:.4em;text-align:center;width:200px;padding:10px 0 10px .4em;border-radius:14px;border:2px solid var(--panel2);background:var(--night);color:var(--ink);outline:none}
.code:focus{border-color:var(--gold)}
.err{color:var(--coral);font-weight:700;font-size:14px;min-height:1.2em}
.row{display:flex;gap:10px;width:100%}
.row button{flex:1;border:0;border-radius:14px;padding:12px;font-weight:700}
.cancel{background:var(--panel2)}
.go{background:var(--coral);color:#1b0f0c}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.disc,.shake{animation:none}.start:active{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>More games</a>
  <h1>Four in<br><span>a Row</span></h1>
  <p class="sub">Drop your discs. Get four in a line to win.</p>
  <div class="board" id="board" aria-hidden="true"></div>
  <p class="status" id="status" hidden aria-live="polite"></p>
  <div class="controls" id="controls" hidden>
    <button id="vsCpu" class="on" aria-pressed="true">Vs computer</button>
    <button id="vs2" aria-pressed="false">2 players</button>
    <button id="again">New game</button>
  </div>
  <button class="start" id="startBtn">Start playing</button>
  <p class="how">Take turns dropping red and yellow discs into the board. The first to line up four across, down or diagonally wins.</p>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <form class="card" id="form">
    <h2 id="sheetTitle">Prove you're a Chaim</h2>
    <p>Only real Chaims can play. Enter the Chaim code to start.</p>
    <input class="code" id="code" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Chaim code">
    <div class="err" id="err" aria-live="polite"></div>
    <div class="row"><button type="button" class="cancel" id="cancel">Cancel</button><button type="submit" class="go">Start playing</button></div>
  </form>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
// a board that fills itself up for show
const board = $("#board"), cells = [];
for (let i = 0; i < 42; i++) { const c = document.createElement("div"); c.className = "cell"; board.appendChild(c); cells.push(c); }
const heights = [0, 0, 0, 0, 0, 0, 0]; let demoTurn = 0, drops = 0;
function dropOne() {
  if (drops >= 16) { cells.forEach(c => c.replaceChildren()); heights.fill(0); drops = 0; }
  let col; do { col = Math.floor(Math.random() * 7); } while (heights[col] >= 6);
  const row = 5 - heights[col]++, d = document.createElement("i");
  d.className = "disc " + (demoTurn++ % 2 ? "y" : "r"); cells[row * 7 + col].appendChild(d); drops++;
}
const demo = matchMedia("(prefers-reduced-motion: reduce)").matches ? (() => { for (let i = 0; i < 10; i++) dropOne(); return 0; })() : setInterval(dropOne, 650);

const KEY = [54, 55, 54, 55]; // the Chaim code
const open = () => { $("#sheet").hidden = false; $("#err").textContent = ""; $("#code").value = ""; setTimeout(() => $("#code").focus(), 50); };
const close = () => { $("#sheet").hidden = true; };
$("#startBtn").onclick = open;
$("#cancel").onclick = close;
$("#sheet").addEventListener("click", e => { if (e.target === $("#sheet")) close(); });
addEventListener("keydown", e => { if (e.key === "Escape") close(); });
$("#form").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("#code").value;
  if (v.length === KEY.length && [...v].every((ch, i) => ch.charCodeAt(0) === KEY[i])) {
    try { sessionStorage.setItem("c4:ok", "1"); } catch {}
    location.replace("movies.html");
  } else {
    close(); startGame(); // not the code: just play a normal game
  }
});

/* ===== the real game: you are red, the computer (or a friend) is yellow ===== */
const COLS = 7, ROWS = 6;
let grid, turn, over, vsCpu = true, busy = false;
const at = (r, c) => r >= 0 && r < ROWS && c >= 0 && c < COLS ? grid[r][c] : -1;
function lineFrom(g, r, c) {
  const p = g[r][c]; if (!p) return null;
  for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    const cells = [[r, c]];
    for (const s of [1, -1]) for (let k = 1; k < 4; k++) { const rr = r + dr * k * s, cc = c + dc * k * s; if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS || g[rr][cc] !== p) break; cells.push([rr, cc]); }
    if (cells.length >= 4) return cells;
  }
  return null;
}
const openRow = (g, c) => { for (let r = ROWS - 1; r >= 0; r--) if (!g[r][c]) return r; return -1; };
function startGame() {
  clearInterval(demo); $("#startBtn").hidden = true; $(".how").hidden = true; $("#status").hidden = false; $("#controls").hidden = false;
  grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0)); turn = 1; over = false; busy = false;
  cells.forEach(c => { c.replaceChildren(); c.classList.remove("win"); });
  board.classList.add("play"); board.removeAttribute("aria-hidden"); board.setAttribute("aria-label", "Game board. Tap a column to drop a disc");
  say();
}
function say(text) {
  const st = $("#status");
  if (text) { st.innerHTML = text; return; }
  st.innerHTML = vsCpu ? (turn === 1 ? '<span class="r">Your turn</span>' : '<span class="y">Computer is thinking…</span>')
                       : (turn === 1 ? '<span class="r">Red\'s turn</span>' : '<span class="y">Yellow\'s turn</span>');
}
function drop(c) {
  const r = openRow(grid, c); if (r < 0 || over) return false;
  grid[r][c] = turn; const d = document.createElement("i"); d.className = "disc " + (turn === 1 ? "r" : "y"); cells[r * COLS + c].appendChild(d);
  const win = lineFrom(grid, r, c);
  if (win) { over = true; win.forEach(([rr, cc]) => cells[rr * COLS + cc].classList.add("win"));
    say(vsCpu ? (turn === 1 ? '<span class="r">You win!</span>' : '<span class="y">The computer wins</span>') : (turn === 1 ? '<span class="r">Red wins!</span>' : '<span class="y">Yellow wins!</span>')); return true; }
  if (grid[0].every(Boolean)) { over = true; say("It's a draw"); return true; }
  turn = 3 - turn; say(); return true;
}
function cpuMove() {
  const cols = [3, 2, 4, 1, 5, 0, 6].filter(c => openRow(grid, c) >= 0);
  const wins = p => cols.find(c => { const r = openRow(grid, c); grid[r][c] = p; const w = !!lineFrom(grid, r, c); grid[r][c] = 0; return w; });
  let c = wins(2); if (c !== undefined) return c;          // win if it can
  c = wins(1); if (c !== undefined) return c;              // block you
  const safe = cols.filter(cc => { const r = openRow(grid, cc); if (r === 0) return true; grid[r][cc] = 2; grid[r - 1][cc] = 1; const bad = !!lineFrom(grid, r - 1, cc); grid[r - 1][cc] = 0; grid[r][cc] = 0; return !bad; });
  const pick = safe.length ? safe : cols;
  return Math.random() < 0.75 ? pick[0] : pick[Math.floor(Math.random() * pick.length)];
}
board.addEventListener("click", e => {
  if (!board.classList.contains("play") || over || busy || (vsCpu && turn === 2)) return;
  const cell = e.target.closest(".cell"); if (!cell) return;
  const c = cells.indexOf(cell) % COLS;
  if (!drop(c)) return;
  if (vsCpu && !over) { busy = true; setTimeout(() => { busy = false; if (!over) drop(cpuMove()); }, 550); }
});
const setMode = cpu => { vsCpu = cpu; $("#vsCpu").classList.toggle("on", cpu); $("#vs2").classList.toggle("on", !cpu); $("#vsCpu").setAttribute("aria-pressed", String(cpu)); $("#vs2").setAttribute("aria-pressed", String(!cpu)); startGame(); };
$("#vsCpu").onclick = () => setMode(true);
$("#vs2").onclick = () => setMode(false);
$("#again").onclick = startGame;
})();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(() => {}));</script>
</body>
</html>
